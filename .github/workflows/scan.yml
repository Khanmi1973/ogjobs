name: Scan jobs

# Runs the scraper on GitHub's computers and publishes the result to
# GitHub Pages, so the dashboard works on your phone with your PC switched off.
on:
  schedule:
    # Every 4 hours: 00:10, 04:10, 08:10, 12:10, 16:10, 20:10 UTC.
    # Ten past the hour deliberately - GitHub queues cron jobs and the top of
    # the hour is its busiest slot, so off-peak minutes start sooner.
    - cron: "10 */4 * * *"
  workflow_dispatch:        # this is what the "Refresh jobs" button uses
    inputs:
      fresh:
        description: "Ignore cached pages"
        type: boolean
        default: true

permissions:
  contents: write           # needed to commit the refreshed dashboard

concurrency:
  group: ogjobs-scan        # never let two scans run at once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip install step: ogjobs uses only the standard library.

      - name: Scan every enabled source
        # --fresh is deliberate. A committed page cache once made every CI run
        # finish in 30 seconds serving stale pages from disk, because checkout
        # stamps files with the current time so the cache always looked new.
        # data/cache is gitignored again, and this flag makes it impossible to
        # regress silently.
        run: python -m ogjobs run --no-report --fresh
        continue-on-error: true    # one dead site must not fail the whole run

      - name: Fail loudly if the scan was suspiciously quick
        # A real sweep reads thousands of adverts. Far fewer means sources are
        # being skipped, and a silent success is worse than a red cross.
        run: |
          python - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("data/jobs.db")
          row = db.execute(
              "SELECT found, kept FROM runs ORDER BY id DESC LIMIT 1").fetchone()
          if not row:
              sys.exit("No run was recorded - the scan did not complete.")
          found, kept = row
          print("last run scraped %s adverts, %s matched" % (found, kept))
          if found < 1000:
              sys.exit("Only %s adverts scraped; expected several thousand. "
                       "Check the scan log above for failing sources." % found)
          PY

      - name: Build the dashboard into docs/
        run: |
          python -m ogjobs report \
            --out-dir docs \
            --index-name index.html \
            --hosted-url "${{ github.server_url }}/${{ github.repository }}/actions/workflows/scan.yml"
          touch docs/.nojekyll

      - name: Commit the refreshed dashboard
        run: |
          git config user.name  "ogjobs bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/jobs.db
          if git diff --staged --quiet; then
            echo "No changes - nothing to publish."
          else
            git commit -m "Refresh jobs $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Summary
        run: |
          echo "### Scan finished" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import sqlite3
          db = sqlite3.connect("data/jobs.db")
          total = db.execute("SELECT COUNT(*) FROM jobs").fetchone()[0]
          row = db.execute(
              "SELECT found, kept, new FROM runs ORDER BY id DESC LIMIT 1").fetchone()
          print("")
          print("- Jobs on the dashboard: **%d**" % total)
          if row:
              print("- This run: %d scraped, %d matched, **%d new**" % row)
          print("")
          print("Open the dashboard from the repository's Pages URL.")
          PY
